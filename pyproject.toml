[project]
name = "PowerMeter"
version = "0.1.0"
description = "MQTT consumer for STM32 power meter data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.0",
    "plotly>=6.5.2",
    "pyserial>=3.5",
    "streamlit>=1.54.0",
    "paho-mqtt>=2.1.0",
    "influxdb>=5.3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "ruff>=0.8.0",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv -ra -q"
log_cli = false
log_cli_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = "ignore"
cache_dir = ".pytest_cache"
